<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 20px;
      background: linear-gradient(135deg, #ff9a9e, #ffd6e0);
      overflow: hidden;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), #fff);
      padding: 60px 100px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      z-index: 2;
      max-width: 900px;
    }

    h1 { color: #ff2f5a; font-size: 44px; margin: 0; }

    .subtitle { color: #aa2a44; margin-top: 8px; font-size: 18px }

    .buttons {
      margin-top: 40px;
      height: 160px;
    }

    button {
      padding: 16px 44px;
      font-size: 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: fixed; /* key: allows movement across screen */
      transition: left 1s ease, top 1s ease, transform 0.04s cubic-bezier(.2,1,.3,1);
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
      z-index: 60; /* place buttons above the card */
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      left: 50%;
      top: 56%;
      transform: translateX(-160px) scale(1);
    }

    #noBtn {
      background: #ccc;
      left: 50%;
      top: 56%;
      transform: translateX(60px);
    }

    /* Pulse used when No moves - applied to inner label to avoid overwriting button transform */
    .btn-inner { display: inline-block; transform-origin: center center; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .btn-inner.pulse { animation: pulse 260ms ease; }

    /* Floating hearts (confetti) */
    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 22px;
      opacity: 0;
      transform: translateY(0) scale(1);
      animation: floatUp 1400ms cubic-bezier(.2,.8,.2,1) forwards;
      z-index: 999;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-180px) scale(1.6); }
    }

    /* Focus styles */
    button:focus { outline: 3px solid rgba(255,77,109,0.22); }

    /* Settings panel */
    .settings-btn {
      position: fixed;
      right: 18px;
      top: 18px;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 8px 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      cursor: pointer;
      z-index: 120;
    }
    .settings-panel {
      position: fixed;
      right: 18px;
      top: 60px;
      width: 320px;
      background: white;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      z-index: 120;
      display: none;
      font-size: 14px;
    }
    .settings-panel input, .settings-panel button { width: 100%; margin-top: 8px; }
    .settings-panel label { font-weight: 600; color: #333; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="subtitle">Choose wisely — and quickly ✨</div>
  </div>

  <button id="yesBtn" aria-label="Yes"><span class="btn-inner">Yes</span></button>
  <button id="noBtn" aria-label="No">No</button>

  <div class="settings-btn" id="settingsBtn" title="Settings">⚙️</div>
  <div class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Notifications</strong>
      <button id="closeSettings" style="background:none;border:none;cursor:pointer">✕</button>
    </div>
    <label for="notifyEmail">Notify email</label>
    <input id="notifyEmail" placeholder="your@domain.com" />

    <label for="emailjsUser">EmailJS user ID (optional)</label>
    <input id="emailjsUser" placeholder="user_xxx (optional)" />

    <label for="emailjsService">EmailJS service ID (optional)</label>
    <input id="emailjsService" placeholder="service_xxx (optional)" />

    <label for="emailjsTemplate">EmailJS template ID (optional)</label>
    <input id="emailjsTemplate" placeholder="template_xxx (optional)" />

    <button id="saveSettings">Save</button>
    <div style="font-size:12px;color:#666;margin-top:8px">If EmailJS is configured it will send a notification email when someone clicks Yes. Otherwise the page falls back to opening your mail client.</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    let yesScale = 1;

    function createHearts(count = 20) {
      for (let i = 0; i < count; i++) {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = '💖';
        // spawn near the yes button
        const rect = yesBtn.getBoundingClientRect();
        const x = rect.left + rect.width/2 + (Math.random()-0.5)*120;
        const y = rect.top + (Math.random()-0.5)*40;
        h.style.left = `${x}px`;
        h.style.top = `${y}px`;
        h.style.fontSize = `${12 + Math.random()*28}px`;
        document.body.appendChild(h);
        // remove after animation
        setTimeout(() => h.remove(), 1500 + Math.random()*400);
      }
    }

    let yesCentered = false;

    function moveNoSlowly() {
      const padding = 160;
      const x = Math.random() * (window.innerWidth - padding);
      const y = Math.random() * (window.innerHeight - padding);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      // Grow YES button faster and pulse (no upper cap)
      yesScale += 1.2;
      // After the No button starts running, center the Yes button and keep it centered as it grows
      yesBtn.style.left = '50%';
      const translate = yesCentered ? '-50%' : '-50%';
      yesBtn.style.transform = `translateX(${translate}) scale(${yesScale})`;
      yesCentered = true;
      const inner = yesBtn.querySelector('.btn-inner');
      if (inner) {
        inner.classList.add('pulse');
        setTimeout(() => inner.classList.remove('pulse'), 300);
      }

      // small hearts as teaser
      createHearts(6);
    }

    // Runs away when clicked
    noBtn.addEventListener("click", moveNoSlowly);

    // Also runs when cursor gets close (feels alive)
    noBtn.addEventListener("mouseover", moveNoSlowly);

    // YES clicked
    yesBtn.addEventListener("click", async () => {
      createHearts(30);
      // small delay so animation starts
      setTimeout(async () => {
        // load saved config
        const notifyEmail = localStorage.getItem('notifyEmail') || '';
        const emailjsUser = localStorage.getItem('emailjsUser') || '';
        const emailjsService = localStorage.getItem('emailjsService') || '';
        const emailjsTemplate = localStorage.getItem('emailjsTemplate') || '';

        // If EmailJS credentials are set, try to send via EmailJS
        if (emailjsUser && emailjsService && emailjsTemplate) {
          try {
            if (!window.emailjs) {
              // load EmailJS library
              await new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://cdn.emailjs.com/dist/email.min.js';
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
              });
            }
            window.emailjs.init(emailjsUser);
            const params = {
              to_email: notifyEmail || '',
              answer: 'yes',
              time: new Date().toISOString()
            };
            await window.emailjs.send(emailjsService, emailjsTemplate, params);
            alert('GOOD GURL 😏');
          } catch (err) {
            console.error('EmailJS send failed', err);
            alert('GOOD GURL 😏 (email failed — falling back to mail client)');
            if (notifyEmail) window.location.href = `mailto:${encodeURIComponent(notifyEmail)}?subject=Valentine Answer&body=They said YES!`;
          }
        } else if (notifyEmail) {
          // fallback: open mail client to notify
          alert('GOOD GURL 😏');
          window.location.href = `mailto:${encodeURIComponent(notifyEmail)}?subject=Valentine Answer&body=They said YES!`;
        } else {
          // no config: just show popup
          alert('GOOD GURL 😏');
        }
      }, 300);
    });

    // Keyboard shortcuts: Y = yes, N = no
    window.addEventListener('keydown', (e) => {
      if (e.key === 'y' || e.key === 'Y') {
        yesBtn.click();
      } else if (e.key === 'n' || e.key === 'N') {
        moveNoSlowly();
      }
    });

    // Settings UI logic
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeSettings = document.getElementById('closeSettings');
    const saveSettings = document.getElementById('saveSettings');
    const notifyInput = document.getElementById('notifyEmail');
    const emailjsUserInput = document.getElementById('emailjsUser');
    const emailjsServiceInput = document.getElementById('emailjsService');
    const emailjsTemplateInput = document.getElementById('emailjsTemplate');

    function loadSettings() {
      notifyInput.value = localStorage.getItem('notifyEmail') || '';
      emailjsUserInput.value = localStorage.getItem('emailjsUser') || '';
      emailjsServiceInput.value = localStorage.getItem('emailjsService') || '';
      emailjsTemplateInput.value = localStorage.getItem('emailjsTemplate') || '';
    }

    settingsBtn.addEventListener('click', () => {
      settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
      settingsPanel.setAttribute('aria-hidden', settingsPanel.style.display !== 'block');
      loadSettings();
    });
    closeSettings.addEventListener('click', () => { settingsPanel.style.display = 'none'; settingsPanel.setAttribute('aria-hidden', 'true'); });

    saveSettings.addEventListener('click', () => {
      localStorage.setItem('notifyEmail', notifyInput.value.trim());
      localStorage.setItem('emailjsUser', emailjsUserInput.value.trim());
      localStorage.setItem('emailjsService', emailjsServiceInput.value.trim());
      localStorage.setItem('emailjsTemplate', emailjsTemplateInput.value.trim());
      settingsPanel.style.display = 'none';
      settingsPanel.setAttribute('aria-hidden', 'true');
      alert('Settings saved');
    });
  </script>

</body>

</html>
